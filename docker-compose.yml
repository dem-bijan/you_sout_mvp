

services:
  gateway:
    build: ./gateway
    container_name: yscout_gateway
    ports:
      - "8080:8080"
    depends_on:
      - user_service
      - video_service
      - interaction_service
    networks:
      - yscout_net
    environment:
      - JWT_PUBLIC_KEY=/app/keys/public.pem

  user_service:
    build: ./user_service
    container_name: yscout_user
    ports:
      - "8001:8001"
    depends_on:
      - postgres
    networks:
      - yscout_net
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/users

  video_service:
    build: ./video-service
    container_name: yscout_video
    ports:
      - "8002:8002"
    depends_on:
      - mongo
      - minio
    networks:
      - yscout_net
    environment:
      - MONGODB_URL=mongodb://mongo:27017/videos
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin

  interaction_service:
    build: ./interaction_service
    container_name: yscout_interaction
    ports:
      - "8003:8003"
    depends_on:
      - mongo
    networks:
      - yscout_net
    environment:
      - MONGODB_URL=mongodb://mongo:27017/interactions

  postgres:
    image: postgres:15-alpine
    container_name: yscout_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=users
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - yscout_net

  mongo:
    image: mongo:6.0
    container_name: yscout_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - yscout_net

  minio:
    image: minio/minio:latest
    container_name: yscout_minio
    command: server /data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
    volumes:
      - miniodata:/data
    networks:
      - yscout_net

volumes:
  pgdata:
  mongodata:
  miniodata:

networks:
  yscout_net:
    driver: bridge
