name: youscout_app
description: YouScout — Football talent discovery social network.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State & Navigation
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0

  # Network
  dio: ^5.4.3+1

  # Storage
  flutter_secure_storage: ^9.2.2

  # Video
  video_player: ^2.8.6
  chewie: ^1.8.1

  # Media
  image_picker: ^1.1.2

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # Utils
  timeago: ^3.6.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

